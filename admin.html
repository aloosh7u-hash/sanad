<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>لوحة سند</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 p-4">
<h1 class="text-2xl font-bold mb-4">لوحة تحكم سند - أهلا علوش</h1>
<div class="bg-white p-4 rounded-xl shadow mb-4">
<input id="name" placeholder="اسم المنتج" class="border p-2 w-full mb-2 rounded">
<input id="price" placeholder="السعر" class="border p-2 w-full mb-2 rounded">
<button onclick="addProduct()" class="bg-black text-white w-full py-2 rounded">إضافة منتج</button>
</div>
<div id="list" class="bg-white p-4 rounded-xl shadow">الطلبات رح تظهر هون</div>
<script>
function addProduct(){
 const n=document.getElementById('name').value;
 const p=document.getElementById('price').value;
 alert('تم إضافة: '+n+' بسعر '+p+' - لاحقاً رح ينحفظ تلقائياً');
}
</script>
</body></html>
