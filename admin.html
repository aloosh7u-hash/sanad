<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>لوحة سند - مجاني</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-4">
<script>
if(prompt("كلمة سر الادمن:")!=="aloosh123"){document.body.innerHTML="<h1 style='text-align:center;margin-top:100px'>ممنوع</h1>";throw""}
</script>

<h1 class="text-xl font-black mb-4">لوحة سند - الحقيقي 👑 ببلاش</h1>

<div class="grid grid-cols-2 gap-3 mb-6">
  <div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-3xl font-black" id="count">0</p><p class="text-xs text-gray-400">مشتركين</p></div>
  <div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-3xl font-black text-green-400" id="profit">$0</p><p class="text-xs text-gray-400">الأرباح</p></div>
  <div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-3xl font-black" id="active">0</p><p class="text-xs text-gray-400">فعالين</p></div>
  <div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-3xl font-black text-yellow-400" id="wait">0</p><p class="text-xs text-gray-400">بانتظار</p></div>
</div>

<div class="bg-zinc-900 p-4 rounded-2xl mb-4">
  <h3 class="font-bold mb-2">إضافة مشترك جديد (لما يبعتلك شام كاش)</h3>
  <div class="flex gap-2">
    <input id="name" placeholder="رقم الزبون" class="bg-black border border-zinc-700 p-2 rounded-xl w-1/3 text-sm">
    <select id="plan" class="bg-black border border-zinc-700 p-2 rounded-xl w-1/3 text-sm"><option value="5">واتس 5$</option><option value="15">شامل 15$</option></select>
    <button onclick="add()" class="bg-white text-black px-4 rounded-xl font-bold text-sm">إضافة</button>
  </div>
</div>

<div class="bg-zinc-900 p-4 rounded-2xl"><div id="list"></div></div>

<script>
let subs = JSON.parse(localStorage.getItem('sanad')||'[]');
function render(){
  let profit=0,active=0;let html='';
  subs.forEach((s,i)=>{
    profit+=Number(s.price);
    let daysLeft = 30 - Math.floor((Date.now()-s.date)/(1000*60*60*24));
    if(daysLeft>0) active++;
    html+=`<div class="bg-black p-3 rounded-xl flex justify-between items-center mb-2"><div><p class="text-sm font-bold">${s.name} - ${s.price}$</p><p class="text-xs text-gray-400">${daysLeft>0?daysLeft+' يوم باقي':'منتهي'}</p></div><button onclick="del(${i})" class="text-xs text-red-400">حذف</button></div>`;
  });
  document.getElementById('count').innerText=subs.length;
  document.getElementById('profit').innerText='$'+profit;
  document.getElementById('active').innerText=active;
  document.getElementById('wait').innerText=0;
  document.getElementById('list').innerHTML=html||'<p class="text-center text-xs text-gray-500">لسه ما في مشتركين - لما يجيك زبون على الواتساب ضيفو هون</p>';
  localStorage.setItem('sanad',JSON.stringify(subs));
}
function add(){
  let n=document.getElementById('name').value;let p=document.getElementById('plan').value;
  if(!n) return alert('حط رقم الزبون');
  subs.push({name:n,price:p,date:Date.now()});document.getElementById('name').value='';render();
}
function del(i){subs.splice(i,1);render();}
render();
</script>
</body>
</html>
